<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geschiedenis Trainer 🎮</title><style>
:root{font-family:system-ui,sans-serif;color:#18233c;background:#eef3ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#243b88,#7657c9);color:white;padding:30px 18px;text-align:center}h1{margin:0;font-size:2rem}header p{margin:8px}nav{display:flex;gap:8px;overflow-x:auto;padding:12px;background:white;position:sticky;top:0;z-index:2}button{border:0;border-radius:12px;padding:13px 17px;font-size:1rem;font-weight:650;background:#dce6ff;color:#243b88;cursor:pointer}button.active,.primary{background:#3859cb;color:white}main{max-width:850px;margin:20px auto;padding:0 14px 40px}.card{background:white;border-radius:17px;padding:22px;margin:13px 0;box-shadow:0 4px 16px #1d2c4b13}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.option{display:block;width:100%;margin:9px 0;text-align:left}.correct{background:#c9f3d9;color:#135d34}.wrong{background:#ffdbdb;color:#9b2424}.muted{color:#596780}.score{font-weight:bold;color:#344db5}.tag{display:inline-block;background:#e9edff;border-radius:99px;padding:5px 10px;font-size:.85rem}li{margin:10px 0;line-height:1.5}footer{text-align:center;padding:20px;color:#596780}#feedback{min-height:32px;font-weight:700}</style><header><h1>🎮 Geschiedenis Trainer</h1><p>Hoofdstuk 2 • Nederland als industriële samenleving • 3 mavo</p></header><nav id="nav"></nav><main id="app"></main><footer>Gratis oefenen op je telefoon • Je scores blijven op dit apparaat bewaard.</footer><script>
const topics=[
['De industriële revolutie','Vanaf ongeveer 1860 groeide de industrie in Nederland snel. Machines en fabrieken namen werk over van handwerk. Koning Willem I stimuleerde handel, wegen en kanalen. Arbeiders werkten vaak lang en woonden in slechte huizen.'],
['Arbeiders eisen rechten','Vakbonden kwamen op voor betere lonen en werktijden. Socialisten wilden meer gelijkheid. Confessionelen baseerden hun politiek op geloof. Liberalen wilden veel vrijheid. De overheid maakte wetten om arbeiders en kinderen te beschermen.'],
['Van industrie naar diensten','Na 1945 werd Nederland opnieuw opgebouwd, mede dankzij het Marshallplan. De economie groeide en er kwamen gastarbeiders. Na de oliecrisis van 1973 veranderde de industrie. Automatisering en globalisering groeiden; steeds meer mensen gingen in de dienstensector werken.'],
['Milieuproblemen','Industrie en verkeer veroorzaken vervuiling. Mensen gingen aandacht vragen voor natuur en milieu. De Club van Rome waarschuwde in 1972 voor grenzen aan groei. Greenpeace voert actie voor het milieu. Het Klimaatakkoord van Parijs werd gesloten in 2015.']
];
const terms=[
['Industrialisatie','Overgang naar productie met machines in fabrieken'],['Industriële revolutie','Grote verandering door machines en fabrieken'],['Arbeider','Iemand die tegen loon werkt'],['Vakbond','Organisatie die opkomt voor werknemers'],['Socialisme','Politieke stroming die meer gelijkheid wil'],['Confessionelen','Politieke groepen die zich baseren op geloof'],['Liberalisme','Politieke stroming die individuele vrijheid belangrijk vindt'],['Kinderwetje van Van Houten','Wet uit 1874 die fabrieksarbeid voor kinderen onder 12 verbood'],['Arbeidswet','Wet uit 1889 die onder andere werktijden beperkte'],['Leerplichtwet','Wet uit 1901 die kinderen verplicht naar school liet gaan'],['Marshallplan','Amerikaanse hulp voor Europese wederopbouw na WOII'],['Gastarbeider','Werknemer uit een ander land die in Nederland kwam werken'],['Automatisering','Machines en computers nemen taken over'],['Globalisering','Landen en economieën raken wereldwijd meer verbonden'],['Dienstensector','Werk waarbij diensten worden geleverd in plaats van producten gemaakt'],['Milieuvervuiling','Schade aan lucht, water of bodem'],['Club van Rome','Groep die waarschuwde voor grenzen aan economische groei'],['EEG','Europese Economische Gemeenschap, opgericht in 1957'],['Oliecrisis','Economische schok door sterke stijging olieprijzen in 1973'],['Emancipatie','Streven naar gelijke rechten'],['Duurzaamheid','Leven en produceren met aandacht voor toekomstige generaties']
];
const dates=[['1874','Kinderwetje van Van Houten'],['1889','Arbeidswet'],['1901','Leerplichtwet'],['1917','Algemeen mannenkiesrecht'],['1919','Vrouwenkiesrecht'],['1945','Einde Tweede Wereldoorlog en begin wederopbouw'],['1957','Oprichting EEG'],['1972','Rapport van de Club van Rome'],['1973','Oliecrisis'],['2015','Klimaatakkoord van Parijs']];
const questions=[
['Wanneer groeide de Nederlandse industrie sterk?',['Vanaf ongeveer 1860','Vanaf 1600','Vanaf 2000'],0],
['Wat veranderde door de industriële revolutie?',['Meer handwerk','Meer machines en fabrieken','Minder vervoer'],1],
['Welke koning stimuleerde handel en kanalen?',['Willem I','Willem-Alexander','Lodewijk XIV'],0],
['Hoe waren de omstandigheden van veel fabrieksarbeiders?',['Altijd goed','Vaak zwaar en ongezond','Zonder werktijden'],1],
['Wat doet een vakbond?',['Werknemers helpen','Belasting innen','Fabrieken bouwen'],0],
['Welke stroming wilde meer gelijkheid?',['Liberalisme','Socialisme','Nationalisme'],1],
['Waarop baseerden confessionelen hun ideeën?',['Geloof','Sport','Techniek'],0],
['Welk jaar hoort bij het Kinderwetje?',['1874','1901','1919'],0],
['Wat bepaalde de Leerplichtwet?',['Iedereen moest werken','Kinderen moesten naar school','Fabrieken moesten sluiten'],1],
['In welk jaar kwam het vrouwenkiesrecht?',['1917','1919','1957'],1],
['Wat was het Marshallplan?',['Amerikaanse hulp na de oorlog','Een nieuw kanaal','Een vakbond'],0],
['Wat gebeurde na 1945?',['Wederopbouw','Geen handel meer','Alle fabrieken sloten'],0],
['Wanneer werd de EEG opgericht?',['1957','1973','2015'],0],
['Wie waren gastarbeiders?',['Buitenlandse werknemers','Toeristen','Fabriekseigenaren'],0],
['Wat gebeurde in 1973?',['Oliecrisis','Leerplichtwet','Oprichting EEG'],0],
['Wat betekent automatisering?',['Meer handwerk','Taken door machines en computers','Geen technologie'],1],
['Wat is globalisering?',['Wereldwijde verbondenheid','Alleen lokale handel','Minder vervoer'],0],
['Waar werken mensen in de dienstensector?',['Bijvoorbeeld onderwijs en zorg','Alleen in mijnen','Alleen in fabrieken'],0],
['Wat is milieuvervuiling?',['Schade aan natuur en leefomgeving','Een nieuwe wet','Een soort fabriek'],0],
['Waarvoor waarschuwde de Club van Rome?',['Grenzen aan groei','Meer kinderarbeid','Minder scholen'],0],
['In welk jaar kwam het rapport van de Club van Rome?',['1972','1889','1945'],0],
['Wat doet Greenpeace?',['Actie voor milieu en natuur','Belasting innen','Spoorwegen bouwen'],0],
['Wanneer werd het Klimaatakkoord van Parijs gesloten?',['2015','1957','1901'],0],
['Wat is duurzaamheid?',['Rekening houden met de toekomst','Zoveel mogelijk vervuilen','Alles weggooien'],0],
['In welk jaar kwam algemeen mannenkiesrecht?',['1917','1919','1874'],0],
['Wat betekent emancipatie?',['Gelijke rechten nastreven','Meer fabrieken bouwen','Meer olie gebruiken'],0],
['Welk jaar hoort bij de Arbeidswet?',['1889','1945','1973'],0],
['Wat is een voorbeeld van infrastructuur?',['Wegen en kanalen','Een vakbond','Een schoolvak'],0],
['Welke sector werd in Nederland steeds belangrijker?',['Dienstensector','Alleen landbouw','Alleen mijnbouw'],0],
['Wat betekent industrialisatie?',['Productie met machines in fabrieken','Terug naar handwerk','Minder productie'],0]
];
let tab='home',session=null;const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5),best=k=>Number(localStorage.getItem('geschiedenis_'+k)||0),save=(k,v)=>{if(v>best(k))localStorage.setItem('geschiedenis_'+k,v)},esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function go(t){tab=t;session=null;render();scrollTo(0,0)}
function render(){const tabs=[['home','🏠 Start'],['learn','📖 Leren'],['cards','🃏 Kaartjes'],['match','🧩 Match'],['years','📅 Jaartallen'],['quiz','🏆 Quiz'],['exam','📝 Proefwerk']];$('nav').innerHTML=tabs.map(([id,n])=>'<button class="'+(tab===id?'active':'')+'" onclick="go(\''+id+'\')">'+n+'</button>').join('');let a=$('app');if(tab==='home')a.innerHTML='<div class="card"><h2>Welkom! 👋</h2><p>Leer hoofdstuk 2 met leuke spelletjes, kaartjes en een proefwerk.</p><div class="grid">'+tabs.slice(1).map(([id,n])=>'<button onclick="go(\''+id+'\')">'+n+'</button>').join('')+'</div></div><div class="card"><h3>🏅 Jouw records</h3><p>Match: '+best('match')+' punten • Jaartallen: '+best('years')+' punten • Quiz: '+best('quiz')+' punten • Proefwerk: '+best('exam')+'%</p></div>';if(tab==='learn')a.innerHTML=topics.map(([h,t],i)=>'<div class="card"><span class="tag">Paragraaf '+(i+1)+'</span><h2>'+h+'</h2><p>'+t+'</p></div>').join('')+'<div class="card"><h2>Begrippen</h2>'+terms.map(([t,d])=>'<p><b>'+t+':</b> '+d+'</p>').join('')+'</div>';if(tab==='cards')cards();if(['match','years','quiz','exam'].includes(tab))gameView()}
let cardIndex=0,cardFlip=false;function cards(){let [t,d]=terms[cardIndex];$('app').innerHTML='<div class="card" style="text-align:center"><span class="tag">Kaart '+(cardIndex+1)+' van '+terms.length+'</span><h2>'+esc(cardFlip?d:t)+'</h2><button class="primary" onclick="cardFlip=!cardFlip;cards()">🔄 Draai om</button><p><button onclick="cardIndex=(cardIndex+terms.length-1)%terms.length;cardFlip=false;cards()">← Vorige</button> <button onclick="cardIndex=(cardIndex+1)%terms.length;cardFlip=false;cards()">Volgende →</button></p></div>'}
function start(){if(tab==='match'){let items=shuffle(terms).slice(0,6);session={items,left:shuffle(items.map((x,i)=>i)),right:shuffle(items.map((x,i)=>i)),picked:null,found:[],score:0,notice:''}}else{let pool=tab==='years'?dates.map(([y,d])=>[d,shuffle([y,...shuffle(dates.filter(x=>x[0]!==y)).slice(0,3).map(x=>x[0])]),y]):shuffle(questions).slice(0,tab==='exam'?20:10).map(q=>[q[0],q[1],q[1][q[2]]]);session={pool:shuffle(pool),i:0,score:0,answered:false,notice:''}}gameView()}
function gameView(){if(!session){$('app').innerHTML='<div class="card"><h2>'+({match:'🧩 Begrippenmatch',years:'📅 Jaartallenrace',quiz:'🏆 Quiz-avontuur',exam:'📝 Proefwerk'}[tab])+'</h2><p>'+({match:'Zoek de juiste begrippen bij de uitleg.',years:'Kies het juiste jaartal.',quiz:'Beantwoord 10 vragen en verzamel punten.',exam:'Maak 20 vragen en krijg je percentage.'}[tab])+'</p><p class="score">Record: '+best(tab)+(tab==='exam'?'%':' punten')+'</p><button class="primary" onclick="start()">▶ Start het spel</button></div>';return}let s=session;if(tab==='match'){let cells=side=>s[side].map(i=>'<button class="option '+(s.found.includes(i)?'correct':'')+'" '+(s.found.includes(i)?'disabled':'')+' onclick="pickMatch('+i+',\''+side+'\')">'+esc(side==='left'?s.items[i][0]:s.items[i][1])+'</button>').join('');$('app').innerHTML='<div class="card"><h2>🧩 Begrippenmatch</h2><p class="score">Score: '+s.score+' • Goed: '+s.found.length+'/6</p><p>Kies eerst links een begrip, daarna rechts de uitleg.</p><div class="grid"><div>'+cells('left')+'</div><div>'+cells('right')+'</div></div><p id="feedback">'+s.notice+'</p>'+(s.found.length===6?'<h2>🎉 Alles gevonden!</h2><button class="primary" onclick="start()">Opnieuw</button>':'')+'</div>';return}if(s.i>=s.pool.length){let pct=Math.round(s.score/s.pool.length*100);save(tab,tab==='exam'?pct:s.score*10);$('app').innerHTML='<div class="card" style="text-align:center"><h2>🎉 Klaar!</h2><h1>'+s.score+' / '+s.pool.length+'</h1><p>'+pct+'% goed'+(tab==='exam'?' • Cijfer ongeveer '+(1+9*pct/100).toFixed(1).replace('.',','):'')+'</p><button class="primary" onclick="start()">Nog een keer</button></div>';return}let [q,opts,ans]=s.pool[s.i];$('app').innerHTML='<div class="card"><span class="tag">Vraag '+(s.i+1)+' van '+s.pool.length+'</span><p class="score">Goed: '+s.score+'</p><h2>'+esc(q)+'</h2>'+opts.map((o,i)=>'<button class="option '+(s.answered?(o===ans?'correct':s.chosen===i?'wrong':''):'')+'" onclick="choose('+i+')" '+(s.answered?'disabled':'')+'>'+esc(o)+'</button>').join('')+'<p id="feedback">'+s.notice+'</p>'+(s.answered?'<button class="primary" onclick="session.i++;session.answered=false;session.notice=\'\';gameView()">Volgende →</button>':'')+'</div>'}
function pickMatch(i,side){let s=session;if(side==='left'){s.picked=i;s.notice='Nu de juiste uitleg kiezen.'}else if(s.picked===null){s.notice='Kies eerst links een begrip.'}else if(s.picked===i){s.found.push(i);s.score+=20;s.notice='✅ Goed!';s.picked=null;save('match',s.score)}else{s.score=Math.max(0,s.score-5);s.notice='❌ Probeer opnieuw.';s.picked=null}gameView()}
function choose(i){let s=session;if(s.answered)return;let [q,opts,ans]=s.pool[s.i];s.answered=true;s.chosen=i;if(opts[i]===ans){s.score++;s.notice='✅ Goed gedaan!'}else{s.notice='❌ Het goede antwoord is: '+esc(ans)}gameView()}
render();</script></html>
