<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geschiedenis Trainer 🎮</title><style>
:root{font-family:system-ui,sans-serif;color:#18233c;background:#eef3ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#263b92,#6251d8);color:white;padding:30px 18px;text-align:center}h1{margin:0;font-size:2rem}header p{margin:8px}nav{scrollbar-width:thin;display:flex;gap:8px;overflow-x:auto;padding:12px;background:white;position:sticky;top:0;z-index:2}button{border:0;border-radius:12px;padding:13px 17px;font-size:1rem;font-weight:650;background:#dce6ff;color:#243b88;cursor:pointer}button:focus-visible{outline:3px solid #ffb52e;outline-offset:2px}button.active,.primary{background:#3859cb;color:white}main{max-width:920px;margin:20px auto;padding:0 14px 40px}.card{background:white;border-radius:17px;padding:22px;margin:13px 0;box-shadow:0 4px 16px #1d2c4b13}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.option{display:block;width:100%;margin:9px 0;text-align:left}.correct{background:#c9f3d9;color:#135d34}.wrong{background:#ffdbdb;color:#9b2424}.muted{color:#596780}.score{font-weight:bold;color:#344db5}.tag{display:inline-block;background:#e9edff;border-radius:99px;padding:5px 10px;font-size:.85rem}li{margin:10px 0;line-height:1.5}@media(max-width:500px){header{padding:22px 12px}h1{font-size:1.6rem}.card{padding:16px}button{min-height:48px}}.flashcard{border:2px solid #dce2fb;background:linear-gradient(145deg,#fff,#f4f5ff);border-radius:20px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;cursor:pointer;margin:18px 0;box-shadow:0 8px 22px #20275a13}.flashcard h2{font-size:clamp(1.3rem,4vw,2rem);line-height:1.45}.progress{height:10px;border-radius:12px;background:#e6e9f8;overflow:hidden}.progress div{height:100%;background:#5265df;transition:width .2s}footer{text-align:center;padding:20px;color:#596780}#feedback{min-height:32px;font-weight:700}</style><header><h1>🎮 Geschiedenis Trainer</h1><p>Geschiedenis • Hoofdstuk 2 • speciaal voor 3 mavo</p></header><nav id="nav"></nav><main id="app"></main><footer>Gratis oefenen op je telefoon • Je scores blijven op dit apparaat bewaard.</footer><script>
const topics=[
['De industriële revolutie','Eerst maakten veel mensen spullen thuis of in kleine werkplaatsen. Door stoommachines konden fabrieken sneller en goedkoper produceren. In België begon de industrie eerder dan in Nederland. Koning Willem I liet wegen en kanalen aanleggen. Vanaf ongeveer 1860 groeide de Nederlandse industrie sterk. Veel arbeiders verdienden weinig en woonden in kleine, ongezonde huizen.'],
['Arbeiders eisen rechten','Arbeiders richtten vakbonden op om samen betere lonen en kortere werkdagen te eisen. Socialisten wilden kleinere verschillen tussen arm en rijk. Confessionelen vonden dat geloof belangrijk was in de politiek. Liberalen vonden vrijheid belangrijk, maar gingen verschillend denken over ingrijpen door de overheid. Het Kinderwetje van Van Houten (1874) verbood fabrieksarbeid voor kinderen onder 12 jaar, met uitzonderingen. De Arbeidswet (1889) beschermde onder andere vrouwen en kinderen. Door de Leerplichtwet (1901) moesten kinderen naar school.'],
['Van industrie naar diensten','Na de Tweede Wereldoorlog begon de wederopbouw. Nederland kreeg hulp uit de Verenigde Staten via het Marshallplan. Tussen ongeveer 1950 en 1970 groeide de welvaart sterk. Omdat bedrijven personeel nodig hadden, kwamen gastarbeiders naar Nederland. Na de oliecrisis van 1973 kregen bedrijven het moeilijker. Machines namen werk over (automatisering) en bedrijven gingen wereldwijd samenwerken (globalisering). Steeds meer mensen werkten in diensten, zoals zorg, winkels en onderwijs.'],
['Milieuproblemen','Fabrieken, verkeer en energiegebruik kunnen lucht, water en bodem vervuilen. Ook kunnen grondstoffen opraken. De milieubeweging wilde dat bedrijven en overheden de natuur beter beschermen. De Club van Rome waarschuwde in 1972 dat onbeperkte economische groei problemen veroorzaakt. Greenpeace voert milieuacties. Landen spraken in het Klimaatakkoord van Parijs (2015) af om klimaatverandering tegen te gaan.']
];
const terms=[
['Industrialisatie','Overgang naar productie met machines in fabrieken'],['Industriële revolutie','Grote verandering door machines en fabrieken'],['Arbeider','Iemand die tegen loon werkt'],['Vakbond','Organisatie die opkomt voor werknemers'],['Socialisme','Politieke stroming die meer gelijkheid wil'],['Confessionelen','Politieke groepen die zich baseren op geloof'],['Liberalisme','Politieke stroming die individuele vrijheid belangrijk vindt'],['Kinderwetje van Van Houten','Wet uit 1874 die fabrieksarbeid voor kinderen onder 12 verbood'],['Arbeidswet','Wet uit 1889 die onder andere werktijden beperkte'],['Leerplichtwet','Wet uit 1901 die kinderen verplicht naar school liet gaan'],['Marshallplan','Amerikaanse hulp voor Europese wederopbouw na WOII'],['Gastarbeider','Werknemer uit een ander land die in Nederland kwam werken'],['Automatisering','Machines en computers nemen taken over'],['Globalisering','Landen en economieën raken wereldwijd meer verbonden'],['Dienstensector','Werk waarbij diensten worden geleverd in plaats van producten gemaakt'],['Milieuvervuiling','Schade aan lucht, water of bodem'],['Club van Rome','Groep die waarschuwde voor grenzen aan economische groei'],['EEG','Europese Economische Gemeenschap, opgericht in 1957'],['Oliecrisis','Economische schok door sterke stijging olieprijzen in 1973'],['Emancipatie','Streven naar gelijke rechten'],['Duurzaamheid','Leven en produceren met aandacht voor toekomstige generaties']
];
const dates=[['1874','Kinderwetje van Van Houten'],['1889','Arbeidswet'],['1901','Leerplichtwet'],['1917','Algemeen mannenkiesrecht'],['1919','Vrouwenkiesrecht'],['1945','Einde Tweede Wereldoorlog en begin wederopbouw'],['1957','Oprichting EEG'],['1972','Rapport van de Club van Rome'],['1973','Oliecrisis'],['2015','Klimaatakkoord van Parijs']];
const questions=[
['Wanneer groeide de Nederlandse industrie sterk?',['Vanaf ongeveer 1860','Vanaf 1600','Vanaf 2000'],0],
['Wat veranderde door de industriële revolutie?',['Meer handwerk','Meer machines en fabrieken','Minder vervoer'],1],
['Welke koning stimuleerde handel en kanalen?',['Willem I','Willem-Alexander','Lodewijk XIV'],0],
['Hoe waren de omstandigheden van veel fabrieksarbeiders?',['Altijd goed','Vaak zwaar en ongezond','Zonder werktijden'],1],
['Wat doet een vakbond?',['Werknemers helpen','Belasting innen','Fabrieken bouwen'],0],
['Welke stroming wilde meer gelijkheid?',['Liberalisme','Socialisme','Nationalisme'],1],
['Waarop baseerden confessionelen hun ideeën?',['Geloof','Sport','Techniek'],0],
['Welk jaar hoort bij het Kinderwetje?',['1874','1901','1919'],0],
['Wat bepaalde de Leerplichtwet?',['Iedereen moest werken','Kinderen moesten naar school','Fabrieken moesten sluiten'],1],
['In welk jaar kwam het vrouwenkiesrecht?',['1917','1919','1957'],1],
['Wat was het Marshallplan?',['Amerikaanse hulp na de oorlog','Een nieuw kanaal','Een vakbond'],0],
['Wat gebeurde na 1945?',['Wederopbouw','Geen handel meer','Alle fabrieken sloten'],0],
['Wanneer werd de EEG opgericht?',['1957','1973','2015'],0],
['Wie waren gastarbeiders?',['Buitenlandse werknemers','Toeristen','Fabriekseigenaren'],0],
['Wat gebeurde in 1973?',['Oliecrisis','Leerplichtwet','Oprichting EEG'],0],
['Wat betekent automatisering?',['Meer handwerk','Taken door machines en computers','Geen technologie'],1],
['Wat is globalisering?',['Wereldwijde verbondenheid','Alleen lokale handel','Minder vervoer'],0],
['Waar werken mensen in de dienstensector?',['Bijvoorbeeld onderwijs en zorg','Alleen in mijnen','Alleen in fabrieken'],0],
['Wat is milieuvervuiling?',['Schade aan natuur en leefomgeving','Een nieuwe wet','Een soort fabriek'],0],
['Waarvoor waarschuwde de Club van Rome?',['Grenzen aan groei','Meer kinderarbeid','Minder scholen'],0],
['In welk jaar kwam het rapport van de Club van Rome?',['1972','1889','1945'],0],
['Wat doet Greenpeace?',['Actie voor milieu en natuur','Belasting innen','Spoorwegen bouwen'],0],
['Wanneer werd het Klimaatakkoord van Parijs gesloten?',['2015','1957','1901'],0],
['Wat is duurzaamheid?',['Rekening houden met de toekomst','Zoveel mogelijk vervuilen','Alles weggooien'],0],
['In welk jaar kwam algemeen mannenkiesrecht?',['1917','1919','1874'],0],
['Wat betekent emancipatie?',['Gelijke rechten nastreven','Meer fabrieken bouwen','Meer olie gebruiken'],0],
['Welk jaar hoort bij de Arbeidswet?',['1889','1945','1973'],0],
['Wat is een voorbeeld van infrastructuur?',['Wegen en kanalen','Een vakbond','Een schoolvak'],0],
['Welke sector werd in Nederland steeds belangrijker?',['Dienstensector','Alleen landbouw','Alleen mijnbouw'],0],
['Wat betekent industrialisatie?',['Productie met machines in fabrieken','Terug naar handwerk','Minder productie'],0],
['Waarom konden fabrieken door machines meer producten maken?',['Omdat machines sneller werkten','Omdat arbeiders niet meer hoefden te eten','Omdat er minder grondstoffen waren'],0],['Waarom richtten arbeiders vakbonden op?',['Om samen sterk te staan tegenover werkgevers','Om nieuwe koningen te kiezen','Om handel te verbieden'],0],['Waarom kwamen gastarbeiders naar Nederland?',['Er was veel werk en een tekort aan werknemers','Alle scholen waren dicht','Nederland had geen fabrieken'],0],['Wat was een gevolg van automatisering?',['Sommige banen in fabrieken verdwenen','Alle producten werden met de hand gemaakt','De dienstensector verdween'],0],['Waarom werd milieubescherming belangrijker?',['Mensen zagen de gevolgen van vervuiling','Er waren geen fabrieken meer','Alle grondstoffen waren onbeperkt'],0],['Wat is het verschil tussen industrie en diensten?',['Industrie maakt producten, diensten leveren hulp of service','Diensten maken alleen auto’s','Er is geen verschil'],0],['Waarom hielp het Marshallplan Nederland?',['Het gaf steun voor wederopbouw en herstel','Het verbood handel','Het schafte de leerplicht af'],0],['Wat was een gevolg van de oliecrisis?',['Energie werd duurder en de economie kreeg problemen','Er kwam direct vrouwenkiesrecht','De EEG werd opgericht'],0],['Waarom verbeterde de Leerplichtwet de kansen van kinderen?',['Kinderen kregen meer onderwijs','Kinderen moesten langer in fabrieken werken','Scholen werden gesloten'],0],['Wat was een gevolg van globalisering voor bedrijven?',['Ze gingen meer internationaal produceren en handelen','Ze mochten niet meer exporteren','Ze moesten allemaal in één stad blijven'],0]
];
let tab='home',session=null;const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5),best=k=>Number(localStorage.getItem('geschiedenis_'+k)||0),save=(k,v)=>{if(v>best(k))localStorage.setItem('geschiedenis_'+k,v)},esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function go(t){tab=t;session=null;render();scrollTo(0,0)}
function render(){const tabs=[['home','🏠 Start'],['learn','📖 Leren'],['cards','🃏 Flashcards'],['write','✍️ Schrijven'],['match','🧩 Match'],['years','📅 Jaartallen'],['quiz','🏆 Quiz'],['exam','📝 Proefwerk'],['speed','⚡ Snelspel'],['timeline','🕰️ Tijdlijn']];$('nav').innerHTML=tabs.map(([id,n])=>'<button class="'+(tab===id?'active':'')+'" onclick="go(\''+id+'\')">'+n+'</button>').join('');let a=$('app');if(tab==='home')a.innerHTML='<div class="card"><span class="tag">Leren • Oefenen • Toetsen</span><h2>Jouw leeromgeving 👋</h2><p>Oefen geschiedenis op 3 mavo-niveau: eerst begrijpen, dan onthouden en daarna toepassen.</p><div class="grid">'+tabs.slice(1).map(([id,n])=>'<button onclick="go(\''+id+'\')">'+n+'</button>').join('')+'</div></div><div class="card"><h3>🏅 Jouw records</h3><p>Match: '+best('match')+' punten • Jaartallen: '+best('years')+' punten • Quiz: '+best('quiz')+' punten • Proefwerk: '+best('exam')+'%</p></div>';if(tab==='learn')a.innerHTML='<div class="card"><h2>🔎 Zoek een begrip</h2><input id="termSearch" placeholder="Bijvoorbeeld: vakbond" oninput="searchTerms()" style="width:100%;padding:14px;border-radius:10px;border:1px solid #abb8d6;font-size:1rem"><div id="termResults"></div></div>'+topics.map(([h,t],i)=>'<div class="card"><span class="tag">Paragraaf '+(i+1)+'</span><h2>'+h+'</h2><p>'+t+'</p></div>').join('')+'<div class="card"><h2>Begrippen</h2>'+terms.map(([t,d])=>'<p><b>'+t+':</b> '+d+'</p>').join('')+'</div>';if(tab==='cards')cards();if(tab==='write'){writing=null;writeView();}if(['match','years','quiz','exam','speed','timeline'].includes(tab))gameView()}
let cardIndex=0,cardFlip=false,knownCards=JSON.parse(localStorage.getItem('geschiedenis_knownCards')||'[]'),onlyUnknown=false;function cards(){let indexes=terms.map((_,i)=>i).filter(i=>!onlyUnknown||!knownCards.includes(i));if(!indexes.length){$('app').innerHTML='<div class="card"><h2>🎉 Alles geleerd!</h2><p>Je kent alle begrippen. Zet de filter uit om opnieuw te oefenen.</p><button onclick="onlyUnknown=false;cards()">Alle kaartjes tonen</button></div>';return}if(!indexes.includes(cardIndex))cardIndex=indexes[0];let [t,d]=terms[cardIndex];$('app').innerHTML='<div class="card"><h2>🃏 Flashcards</h2><p class="muted">Geleerd: '+knownCards.length+' van '+terms.length+' begrippen</p><div class="progress"><div style="width:'+(knownCards.length/terms.length*100)+'%"></div></div><p><button onclick="onlyUnknown=!onlyUnknown;cards()">'+(onlyUnknown?'✓ Alleen moeilijke':'Alleen nog te leren')+'</button></p><div class="flashcard" onclick="cardFlip=!cardFlip;cards()" role="button" tabindex="0"><span class="tag">'+(cardFlip?'Betekenis':'Begrip')+'</span><h2>'+esc(cardFlip?d:t)+'</h2><p class="muted">Tik om om te draaien ↻</p></div><div class="grid"><button onclick="markCard(false)">🔁 Nog oefenen</button><button class="primary" onclick="markCard(true)">✅ Ik weet het</button></div><p style="text-align:center"><button onclick="moveCard(-1)">← Vorige</button> <button onclick="moveCard(1)">Volgende →</button></p></div>'}
function moveCard(delta){let ids=terms.map((_,i)=>i).filter(i=>!onlyUnknown||!knownCards.includes(i));let pos=ids.indexOf(cardIndex);cardIndex=ids[(pos+delta+ids.length)%ids.length];cardFlip=false;cards()}
function markCard(yes){if(yes&&!knownCards.includes(cardIndex))knownCards.push(cardIndex);if(!yes)knownCards=knownCards.filter(i=>i!==cardIndex);localStorage.setItem('geschiedenis_knownCards',JSON.stringify(knownCards));moveCard(1)}
let writing=null;function writeView(){if(!writing){writing={order:shuffle(terms.map((_,i)=>i)),i:0,good:0,answered:false,notice:''}}let w=writing;if(w.i>=w.order.length){$('app').innerHTML='<div class="card"><h2>🎉 Schrijven afgerond!</h2><p>Je had '+w.good+' van '+terms.length+' goed.</p><button class="primary" onclick="writing=null;writeView()">Opnieuw oefenen</button></div>';return}let [term,def]=terms[w.order[w.i]];$('app').innerHTML='<div class="card"><span class="tag">Schrijven • '+(w.i+1)+'/'+terms.length+'</span><h2>'+esc(def)+'</h2><p>Welk begrip hoort hierbij?</p><input id="writeAnswer" placeholder="Typ het begrip..." autocomplete="off" '+(w.answered?'disabled':'')+' onkeydown="if(event.key===\'Enter\')checkWrite()" style="width:100%;font-size:1.1rem;padding:15px;border:2px solid #c5cdec;border-radius:12px"><p id="feedback">'+w.notice+'</p>'+(w.answered?'<button class="primary" onclick="writing.i++;writing.answered=false;writing.notice=\'\';writeView()">Volgende →</button>':'<button class="primary" onclick="checkWrite()">Controleer</button>')+'</div>'}
function normalizeAnswer(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').trim()}
function checkWrite(){let w=writing;if(w.answered)return;let val=$('writeAnswer').value.trim();if(!val)return;let correct=terms[w.order[w.i]][0];let ok=normalizeAnswer(val)===normalizeAnswer(correct);if(ok)w.good++;w.answered=true;w.notice=ok?'✅ Helemaal goed!':'💡 Goede antwoord: '+esc(correct);writeView()}
function searchTerms(){let q=$('termSearch').value.toLowerCase().trim();$('termResults').innerHTML=q?terms.filter(([t,d])=>(t+' '+d).toLowerCase().includes(q)).map(([t,d])=>'<p><b>'+esc(t)+'</b>: '+esc(d)+'</p>').join('')||'<p>Geen begrip gevonden.</p>':''}
function start(){if(tab==='match'){let items=shuffle(terms).slice(0,6);session={items,left:shuffle(items.map((x,i)=>i)),right:shuffle(items.map((x,i)=>i)),picked:null,found:[],score:0,notice:''}}else{let pool=tab==='timeline'?dates.map(([y,d])=>['Welk jaartal hoort bij: '+d+'?',shuffle([y,...shuffle(dates.filter(x=>x[0]!==y)).slice(0,3).map(x=>x[0])]),y]):tab==='years'?dates.map(([y,d])=>[d,shuffle([y,...shuffle(dates.filter(x=>x[0]!==y)).slice(0,3).map(x=>x[0])]),y]):shuffle(questions).slice(0,tab==='exam'?20:tab==='speed'?15:10).map(q=>[q[0],q[1],q[1][q[2]]]);session={pool:shuffle(pool),i:0,score:0,answered:false,notice:'',streak:0}}gameView()}
function gameView(){if(!session){$('app').innerHTML='<div class="card"><h2>'+({match:'🧩 Begrippenmatch',years:'📅 Jaartallenrace',quiz:'🏆 Quiz-avontuur',exam:'📝 Proefwerk',speed:'⚡ Snelspel',timeline:'🕰️ Tijdlijn'}[tab])+'</h2><p>'+({match:'Zoek de juiste begrippen bij de uitleg.',years:'Kies het juiste jaartal.',quiz:'Beantwoord 10 vragen en verzamel punten.',exam:'Maak 20 vragen op 3 mavo-niveau en krijg je percentage.',speed:'15 snelle vragen. Hoeveel weet jij?',timeline:'Zet gebeurtenissen bij het juiste jaartal.'}[tab])+'</p><p class="score">Record: '+best(tab)+(tab==='exam'?'%':' punten')+'</p><button class="primary" onclick="start()">▶ Start het spel</button></div>';return}let s=session;if(tab==='match'){let cells=side=>s[side].map(i=>'<button class="option '+(s.found.includes(i)?'correct':'')+'" '+(s.found.includes(i)?'disabled':'')+' onclick="pickMatch('+i+',\''+side+'\')">'+esc(side==='left'?s.items[i][0]:s.items[i][1])+'</button>').join('');$('app').innerHTML='<div class="card"><h2>🧩 Begrippenmatch</h2><p class="score">Score: '+s.score+' • Goed: '+s.found.length+'/6</p><p>Kies eerst links een begrip, daarna rechts de uitleg.</p><div class="grid"><div>'+cells('left')+'</div><div>'+cells('right')+'</div></div><p id="feedback">'+s.notice+'</p>'+(s.found.length===6?'<h2>🎉 Alles gevonden!</h2><button class="primary" onclick="start()">Opnieuw</button>':'')+'</div>';return}if(s.i>=s.pool.length){let pct=Math.round(s.score/s.pool.length*100);save(tab,tab==='exam'?pct:s.score*10);$('app').innerHTML='<div class="card" style="text-align:center"><h2>🎉 Klaar!</h2><h1>'+s.score+' / '+s.pool.length+'</h1><p>'+pct+'% goed'+(tab==='exam'?' • Cijfer ongeveer '+(1+9*pct/100).toFixed(1).replace('.',','):'')+'</p><button class="primary" onclick="start()">Nog een keer</button></div>';return}let [q,opts,ans]=s.pool[s.i];$('app').innerHTML='<div class="card"><span class="tag">Vraag '+(s.i+1)+' van '+s.pool.length+'</span><p class="score">Goed: '+s.score+' • 🔥 Reeks: '+s.streak+'</p><h2>'+esc(q)+'</h2>'+opts.map((o,i)=>'<button class="option '+(s.answered?(o===ans?'correct':s.chosen===i?'wrong':''):'')+'" onclick="choose('+i+')" '+(s.answered?'disabled':'')+'>'+esc(o)+'</button>').join('')+'<p id="feedback">'+s.notice+'</p>'+(s.answered?'<button class="primary" onclick="session.i++;session.answered=false;session.notice=\'\';gameView()">Volgende →</button>':'')+'</div>'}
function pickMatch(i,side){let s=session;if(side==='left'){s.picked=i;s.notice='Nu de juiste uitleg kiezen.'}else if(s.picked===null){s.notice='Kies eerst links een begrip.'}else if(s.picked===i){s.found.push(i);s.score+=20;s.notice='✅ Goed!';s.picked=null;save('match',s.score)}else{s.score=Math.max(0,s.score-5);s.notice='❌ Probeer opnieuw.';s.picked=null}gameView()}
function choose(i){let s=session;if(s.answered)return;let [q,opts,ans]=s.pool[s.i];s.answered=true;s.chosen=i;if(opts[i]===ans){s.score++;s.streak++;s.notice='✅ Goed gedaan! '+(s.streak>=3?'🔥 '+s.streak+' op rij!':'')}else{s.streak=0;s.notice='❌ Het goede antwoord is: '+esc(ans)}gameView()}
render();</script></html>
